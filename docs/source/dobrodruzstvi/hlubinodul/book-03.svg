       transform="matrix(0.48631336,0,0,0.48631336,149.82655,56.181064)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan46">Poltergeisti jsou většinou </tspan><tspan
         x="37.082859"
         y="133.38703"
         id="tspan47">neviditelní. Když se </tspan><tspan
         x="37.082859"
         y="141.36658"
         id="tspan48">poltergeist zviditelní, </tspan><tspan
         x="37.082859"
         y="149.34612"
         id="tspan49">vypadá jako člověk </tspan><tspan
         x="37.082859"
         y="157.32566"
         id="tspan50">oděný do cárů látek a </tspan><tspan
         x="37.082859"
         y="165.30519"
         id="tspan51">ověšený těžkými řetězy; </tspan><tspan
         x="37.082859"
         y="173.28473"
         id="tspan52">na nich připevněny </tspan><tspan
         x="37.082859"
         y="181.26427"
         id="tspan53">předměty, které </tspan><tspan
         x="37.082859"
         y="189.24381"
         id="tspan54">symbolizovaly zlé činy, </tspan><tspan
         x="37.082859"
         y="197.22335"
         id="tspan55">jež dotyčný vykonal za </tspan><tspan
         x="37.082859"
         y="205.20288"
         id="tspan56">svého života. Mrtvý, </tspan><tspan
         x="37.082859"
         y="213.18242"
         id="tspan57">který nemůže pustit, </tspan><tspan
         x="37.082859"
         y="221.16196"
         id="tspan58">hýbe tím, co zbylo. </tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9.05529px;line-height:1;font-family:'Noto Serif';-inkscape-font-specification:'Noto Serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;white-space:pre;inline-size:95.0991;display:inline;fill:#800000;stroke:none;stroke-width:1.02814"
       x="37.082859"
       y="125.40749"
       id="text32-6"
       transform="matrix(0.48631336,0,0,0.48631336,206.53229,55.088925)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan59">Odolává jedu a </tspan><tspan
         x="37.082859"
         y="134.46279"
         id="tspan60">kyselině, stejně jako </tspan><tspan
         x="37.082859"
         y="143.51807"
         id="tspan61">nekrotickému úderu, </tspan><tspan
         x="37.082859"
         y="152.57337"
         id="tspan62">ale nejvíce mu škodí </tspan><tspan
         x="37.082859"
         y="161.62867"
         id="tspan63">zářivá kouzla. Přímý </tspan><tspan
         x="37.082859"
         y="170.68396"
         id="tspan64">boj je extrémně těžký, </tspan><tspan
         x="37.082859"
         y="179.73926"
         id="tspan65">protože tradičně je </tspan><tspan
         x="37.082859"
         y="188.79456"
         id="tspan66">neviditelný a je </tspan><tspan
         x="37.082859"
         y="197.84986"
         id="tspan67">zranitelný jen </tspan><tspan
         x="37.082859"
         y="206.90515"
         id="tspan68">magickými či </tspan><tspan
         x="37.082859"
         y="215.96045"
         id="tspan69">stříbrnými zbraněmi. </tspan><tspan
         x="37.082859"
         y="225.01575"
         id="tspan70">Na své oběti </tspan><tspan
         x="37.082859"
         y="234.07105"
         id="tspan71">nejčastěji vysokou </tspan><tspan
         x="37.082859"
         y="243.12635"
         id="tspan72">rychlostí vrhá </tspan><tspan
         x="37.082859"
         y="252.18164"
         id="tspan73">libovolné dostupné </tspan><tspan
         x="37.082859"
         y="261.23694"
         id="tspan74">předměty.</tspan></text><image
