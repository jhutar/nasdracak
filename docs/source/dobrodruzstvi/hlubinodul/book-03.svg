         y="125.40749"
         id="tspan34">Pravidlo:
</tspan><tspan
         x="37.082859"
         y="134.46279"
         id="tspan35">
</tspan><tspan
         x="37.082859"
         y="143.51807"
         id="tspan36">Po přečtení během </tspan><tspan
         x="37.082859"
         y="152.57337"
         id="tspan37">dlouhého odpočinku/</tspan><tspan
         x="37.082859"
         y="161.62867"
         id="tspan38">long rest získává </tspan><tspan
         x="37.082859"
         y="170.68396"
         id="tspan39">postava bonus +1 na </tspan><tspan
         x="37.082859"
         y="179.73926"
         id="tspan40">ověření na Přírodu/</tspan><tspan
         x="37.082859"
         y="188.79456"
         id="tspan41">Nature nebo na </tspan><tspan
         x="37.082859"
         y="197.84986"
         id="tspan42">použití bylinkářské </tspan><tspan
         x="37.082859"
         y="206.90515"
         id="tspan43">sady/herbalism kit </tspan><tspan
         x="37.082859"
         y="215.96045"
         id="tspan44">pro podzemní </tspan><tspan
         x="37.082859"
         y="225.01575"
         id="tspan45">rostliny.</tspan></text><image
