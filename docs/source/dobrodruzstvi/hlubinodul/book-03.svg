         x="37.082859"
         y="125.40749"
         id="tspan11">Ilustrovaný přehled </tspan><tspan
         x="37.082859"
         y="133.02432"
         id="tspan12">podzemních rostlin, </tspan><tspan
         x="37.082859"
         y="140.64115"
         id="tspan13">lišejníků a hub.
</tspan><tspan
         x="37.082859"
         y="148.25798"
         id="tspan14">
</tspan><tspan
         x="37.082859"
         y="155.87482"
         id="tspan15">Příznivé svítivé mechy </tspan><tspan
         x="37.082859"
         y="163.49166"
         id="tspan16">poznáte podle </tspan><tspan
         x="37.082859"
         y="171.10849"
         id="tspan17">modrozelené záře a </tspan><tspan
         x="37.082859"
         y="178.72533"
         id="tspan18">měkkého, vlhkého </tspan><tspan
         x="37.082859"
         y="186.34217"
         id="tspan19">povrchu. Druh č. 101  </tspan><tspan
         x="37.082859"
         y="193.959"
         id="tspan20">který svítí červeně, ten </tspan><tspan
         x="37.082859"
         y="201.57584"
         id="tspan21">nechejte být.
</tspan><tspan
         x="37.082859"
         y="209.19268"
         id="tspan22">
</tspan><tspan
         x="37.082859"
         y="216.80951"
         id="tspan23">Nebezpečné houby rostou </tspan><tspan
         x="37.082859"
         y="224.42635"
         id="tspan24">v hloučcích a voní po </tspan><tspan
         x="37.082859"
         y="232.04319"
         id="tspan25">čerstvém masu.
</tspan><tspan
         x="37.082859"
         y="239.66002"
         id="tspan26">
</tspan><tspan
         x="37.082859"
         y="247.27686"
         id="tspan27">Než začnete cokoliv sbírat, </tspan><tspan
         x="37.082859"
         y="254.8937"
         id="tspan28">chvíli počkejte a sledujte </tspan><tspan
         x="37.082859"
         y="262.51052"
         id="tspan29">neb různá nebezpečí se </tspan><tspan
         x="37.082859"
         y="270.12734"
         id="tspan30">maskují jako rostliny. </tspan><tspan
         x="37.082859"
         y="277.74416"
         id="tspan31">Rovněž ovoce na rostlině </tspan><tspan
         x="37.082859"
         y="285.36098"
         id="tspan32">je v podzemí velmi </tspan><tspan
         x="37.082859"
         y="292.9778"
         id="tspan33">podezřelé!</tspan></text><text
