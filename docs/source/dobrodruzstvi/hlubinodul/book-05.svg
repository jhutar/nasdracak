         id="tspan51">
</tspan><tspan
         x="37.082859"
         y="147.1402"
         id="tspan52">A tak zůstal v kobce a </tspan><tspan
         x="37.082859"
         y="158.00655"
         id="tspan53">přemýšlel dál, a </tspan><tspan
         x="37.082859"
         y="168.87289"
         id="tspan54">přemýšlel, a </tspan><tspan
         x="37.082859"
         y="179.73924"
         id="tspan55">přemýšlel, dokud mu </tspan><tspan
         x="37.082859"
         y="190.60559"
         id="tspan56">nezesklovatěly oči a </tspan><tspan
         x="37.082859"
         y="201.47194"
         id="tspan57">nezačal mluvit sám se </tspan><tspan
         x="37.082859"
         y="212.33829"
         id="tspan58">sebou. Kdo četl až </tspan><tspan
         x="37.082859"
         y="223.20464"
         id="tspan59">sem, ten ví, že trest </tspan><tspan
         x="37.082859"
         y="234.07098"
         id="tspan60">není v sekeře či </tspan><tspan
         x="37.082859"
         y="244.93733"
         id="tspan61">okovech, ale v hlavě.</tspan></text><text
