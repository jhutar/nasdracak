       transform="matrix(0.48631336,0,0,0.48631336,149.82655,56.181064)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan40">Kovářský učeň, který </tspan><tspan
         x="37.082859"
         y="136.27385"
         id="tspan41">v opilosti rozbil cizí </tspan><tspan
         x="37.082859"
         y="147.1402"
         id="tspan42">kovadlinu, sedí teď v </tspan><tspan
         x="37.082859"
         y="158.00655"
         id="tspan43">jedné zastrčené </tspan><tspan
         x="37.082859"
         y="168.87289"
         id="tspan44">chodbě dolu a </tspan><tspan
         x="37.082859"
         y="179.73924"
         id="tspan45">přemýšlí. Co zaslouží </tspan><tspan
         x="37.082859"
         y="190.60559"
         id="tspan46">za trest ten, kdo zničí </tspan><tspan
         x="37.082859"
         y="201.47194"
         id="tspan47">to, co je důležitější než </tspan><tspan
         x="37.082859"
         y="212.33829"
         id="tspan48">on? Je to trest, nebo je </tspan><tspan
         x="37.082859"
         y="223.20464"
