       transform="matrix(0.48631336,0,0,0.48631336,10.829719,56.329352)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan1">23. Mirtul 1391 DR.
Čekáme ve svatyni. Oheň na oltáři je jediný, který drží. Lidé mizí jeden po druhém a já nevím, jestli to je útěk, nebo exekuce. Svíčka hoří dole a já píšu, abych si pamatoval.</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9.05529px;line-height:0.8;font-family:'Noto Serif';-inkscape-font-specification:'Noto Serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;white-space:pre;inline-size:95.0991;display:inline;fill:#800000;stroke:none;stroke-width:1.02814"
       x="37.082859"
       y="125.40749"
       id="text32"
       transform="matrix(0.48631336,0,0,0.48631336,67.408215,56.25521)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan4">25. Nightal 1391 DR.
Poslední se třídí do skupin a odchází. Zůstáváme tři a já zamykám dveře odvnitř.

27. Nightal 1391 DR.
Dveře jsou zamčené. Já píšu. Oheň je stále tam.</tspan></text><image
