       transform="matrix(0.48631336,0,0,0.48631336,10.829719,56.329352)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan7">Maminka poslala </tspan><tspan
         x="37.082859"
         y="134.46279"
         id="tspan8">Měděnou helmičku k </tspan><tspan
         x="37.082859"
         y="143.51807"
         id="tspan9">babičce. Babička byla </tspan><tspan
         x="37.082859"
         y="152.57337"
         id="tspan10">už dlouho nemocná a </tspan><tspan
         x="37.082859"
         y="161.62867"
         id="tspan11">někdo jí musel čas od </tspan><tspan
         x="37.082859"
         y="170.68396"
         id="tspan12">času přinést nové </tspan><tspan
         x="37.082859"
         y="179.73926"
         id="tspan13">záznamy o těžbě aby </tspan><tspan
         x="37.082859"
         y="188.79456"
         id="tspan14">se zabavila. Kniha </tspan><tspan
         x="37.082859"
         y="197.84986"
         id="tspan15">popisuje Helmiččinu </tspan><tspan
         x="37.082859"
         y="206.90515"
         id="tspan16">nebezpečnou cestu po </tspan><tspan
         x="37.082859"
         y="215.96045"
         id="tspan17">povrchu do sousední </tspan><tspan
         x="37.082859"
         y="225.01575"
         id="tspan18">kolonie a setkání se </tspan><tspan
         x="37.082859"
         y="234.07105"
         id="tspan19">zdivočelým elfem. </tspan><tspan
         x="37.082859"
         y="243.12635"
         id="tspan20">Když Helmička dorazí </tspan><tspan
         x="37.082859"
         y="252.18164"
         id="tspan21">k babičce, všimne si </tspan><tspan
         x="37.082859"
         y="261.23694"
         id="tspan22">že má jakési velké oči.</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9.05529px;line-height:1;font-family:'Noto Serif';-inkscape-font-specification:'Noto Serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;white-space:pre;inline-size:95.0991;display:inline;fill:#800000;stroke:none;stroke-width:1.02814"
       x="37.082859"
       y="125.40749"
       id="text32"
       transform="matrix(0.48631336,0,0,0.48631336,67.408215,56.25521)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan23">Příběh dále popisuje </tspan><tspan
         x="37.082859"
         y="134.46279"
         id="tspan24">jak malá statečná </tspan><tspan
         x="37.082859"
         y="143.51807"
         id="tspan25">trpaslice odhalí kde je </tspan><tspan
         x="37.082859"
         y="152.57337"
         id="tspan26">problém. Zdivočelý </tspan><tspan
         x="37.082859"
         y="161.62867"
         id="tspan27">elf kterého potkala a </tspan><tspan
         x="37.082859"
         y="170.68396"
         id="tspan28">nerozvážně mu </tspan><tspan
         x="37.082859"
         y="179.73926"
         id="tspan29">pověděla o tom kde </tspan><tspan
         x="37.082859"
         y="188.79456"
         id="tspan30">babička bydlí, dorazil </tspan><tspan
         x="37.082859"
         y="197.84986"
         id="tspan31">dříve a babičku </tspan><tspan
         x="37.082859"
         y="206.90515"
         id="tspan32">oblouznil. Helmička </tspan><tspan
         x="37.082859"
         y="215.96045"
         id="tspan33">se spojí s místním </tspan><tspan
         x="37.082859"
         y="225.01575"
         id="tspan34">kovářem a ve </tspan><tspan
         x="37.082859"
         y="234.07105"
         id="tspan35">strhujícím závěru ve </tspan><tspan
         x="37.082859"
         y="243.12635"
         id="tspan36">kterém hraje hlavní </tspan><tspan
         x="37.082859"
         y="252.18164"
         id="tspan37">roli kovářovo velké </tspan><tspan
         x="37.082859"
         y="261.23694"
         id="tspan38">kladivo, babičku </tspan><tspan
         x="37.082859"
         y="270.29224"
         id="tspan39">vyléčí.</tspan></text><image
