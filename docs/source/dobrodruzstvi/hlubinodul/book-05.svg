         x="165.32535"
         y="71.958519">Jazyk: obecná řeč</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9.05529px;line-height:0.8;font-family:'Noto Serif';-inkscape-font-specification:'Noto Serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;white-space:pre;inline-size:97.4809;display:inline;fill:#800000;stroke:none;stroke-width:1.02814"
       x="37.082859"
       y="125.40749"
       id="text7-0"
       transform="matrix(0.48631336,0,0,0.48631336,149.82655,56.181064)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan5">Mistr kovář, který v opilosti rozbil cizí kovadlinu, sedí teď v kobce a přemýšlí. Co je to za trest, který zaslouží ten, kdo zničí to, co je důležitější než on? Je to trest, nebo je to cena?</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9.05529px;line-height:0.8;font-family:'Noto Serif';-inkscape-font-specification:'Noto Serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;white-space:pre;inline-size:95.0991;display:inline;fill:#800000;stroke:none;stroke-width:1.02814"
       x="37.082859"
       y="125.40749"
       id="text32-6"
       transform="matrix(0.48631336,0,0,0.48631336,206.53229,55.088925)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan6">(stránka 601 z 600)
A tak zůstal v kobce a přemýšlel dál, a přemýšlel dál, a přemýšlel dál, dokud mu nezesklovatěly oči a nezačal mluvit sám se sebou. Kdo četl až sem, ten ví, že trest není v kladivu, ale v tom, kdo ho drží.</tspan></text></g></svg>
