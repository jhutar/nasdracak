       transform="matrix(0.48631336,0,0,0.48631336,149.82655,56.181064)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan31">Panika ve městě </tspan><tspan
         x="37.082859"
         y="134.46279"
         id="tspan32">narůstá a já ji vidím v </tspan><tspan
         x="37.082859"
         y="143.51807"
         id="tspan33">očích každého, kdo </tspan><tspan
         x="37.082859"
         y="152.57337"
         id="tspan34">vejde do mé </tspan><tspan
         x="37.082859"
         y="161.62867"
         id="tspan35">kanceláře. Všichni </tspan><tspan
         x="37.082859"
         y="170.68396"
         id="tspan36">chtějí stejnou věc: </tspan><tspan
         x="37.082859"
         y="179.73926"
         id="tspan37">svůj vklad zpět a </tspan><tspan
         x="37.082859"
         y="188.79456"
         id="tspan38">dveře za sebou </tspan><tspan
         x="37.082859"
         y="197.84986"
         id="tspan39">zavírají jak jen to jde. </tspan><tspan
         x="37.082859"
         y="206.90515"
         id="tspan40">Stejně tak přichází </tspan><tspan
         x="37.082859"
         y="215.96045"
         id="tspan41">dlužníci a žádají o </tspan><tspan
         x="37.082859"
         y="225.01575"
         id="tspan42">odpuštění dluhu. Já </tspan><tspan
         x="37.082859"
         y="234.07105"
         id="tspan43">jim však dávám stále </tspan><tspan
         x="37.082859"
         y="243.12635"
         id="tspan44">stejnou odpověď: </tspan><tspan
         x="37.082859"
         y="252.18164"
         id="tspan45">královské půjčky se </tspan><tspan
         x="37.082859"
         y="261.23694"
         id="tspan46">neodpouští, půjčky se </tspan><tspan
         x="37.082859"
         y="270.29224"
         id="tspan47">splácí.</tspan></text><text
       xml:space="preserve"
