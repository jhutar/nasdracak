       id="text32-6"
       transform="matrix(0.48631336,0,0,0.48631336,206.53229,55.088925)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan48">Spousta mých </tspan><tspan
         x="37.082859"
         y="134.46279"
         id="tspan49">sousedů uteklo bez </tspan><tspan
         x="37.082859"
         y="143.51807"
         id="tspan50">vyrovnání svých </tspan><tspan
         x="37.082859"
         y="152.57337"
         id="tspan51">účtů. Je to hanba, </tspan><tspan
         x="37.082859"
         y="161.62867"
         id="tspan52">jakou si nemohu </tspan><tspan
         x="37.082859"
         y="170.68396"
         id="tspan53">odpustit. Ať si všichni </tspan><tspan
         x="37.082859"
         y="179.73926"
         id="tspan54">utečou, já tu zůstanu! </tspan><tspan
         x="37.082859"
         y="188.79456"
         id="tspan55">Žádný trpaslík </tspan><tspan
         x="37.082859"
         y="197.84986"
         id="tspan56">neodejde, aniž by </tspan><tspan
         x="37.082859"
         y="206.90515"
         id="tspan57">zaplatil své úroky. </tspan><tspan
         x="37.082859"
         y="215.96045"
         id="tspan58">Můj úřad je má </tspan><tspan
         x="37.082859"
         y="225.01575"
         id="tspan59">pevnost!</tspan></text></g></svg>
