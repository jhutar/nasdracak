         x="37.082859"
         y="125.40749"
         id="tspan8">Prababička žila v </tspan><tspan
         x="37.082859"
         y="136.27385"
         id="tspan9">horské sluji a pletla </tspan><tspan
         x="37.082859"
         y="147.1402"
         id="tspan10">drátěné košile pro svá </tspan><tspan
         x="37.082859"
         y="158.00655"
         id="tspan11">vnoučata. Pekla </tspan><tspan
         x="37.082859"
         y="168.87289"
         id="tspan12">kamenné placky a </tspan><tspan
         x="37.082859"
         y="179.73924"
         id="tspan13">udělovala moudré </tspan><tspan
         x="37.082859"
         y="190.60559"
         id="tspan14">rady místním </tspan><tspan
         x="37.082859"
         y="201.47194"
         id="tspan15">horníkům. Nikdy si </tspan><tspan
         x="37.082859"
         y="212.33829"
         id="tspan16">nestěžovala, nikdy se </tspan><tspan
         x="37.082859"
         y="223.20464"
         id="tspan17">nelekala.</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9.05529px;line-height:1.2;font-family:'Noto Serif';-inkscape-font-specification:'Noto Serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;white-space:pre;inline-size:95.0991;display:inline;fill:#800000;stroke:none;stroke-width:1.02814"
       x="37.082859"
       y="125.40749"
       id="text32"
       transform="matrix(0.48631336,0,0,0.48631336,67.408215,56.25521)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan18">Jednou se jí ptali, </tspan><tspan
         x="37.082859"
         y="136.27385"
         id="tspan19">proč je tak šťastná. </tspan><tspan
         x="37.082859"
         y="147.1402"
         id="tspan20">Usmlála se a řekla: </tspan><tspan
         x="37.082859"
         y="158.00655"
         id="tspan21">„Protože jsem nikdy </tspan><tspan
         x="37.082859"
         y="168.87289"
         id="tspan22">neztratila své kladivo, </tspan><tspan
         x="37.082859"
         y="179.73924"
         id="tspan23">ani v nejhlubší </tspan><tspan
         x="37.082859"
         y="190.60559"
         id="tspan24">šachtě.“
</tspan><tspan
         x="37.082859"
         y="201.47194"
         id="tspan25">
</tspan><tspan
         x="37.082859"
         y="212.33829"
         id="tspan26">Šťastná to žena, jež </tspan><tspan
         x="37.082859"
         y="223.20464"
         id="tspan27">ani v nejhlubší šachtě </tspan><tspan
         x="37.082859"
         y="234.07098"
         id="tspan28">neztratila své </tspan><tspan
         x="37.082859"
         y="244.93733"
         id="tspan29">kovářské kladivo.</tspan></text><image
