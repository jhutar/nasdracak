         id="tspan39">Vstávejte, děti ohně,<tspan
   y="125.40749"
   id="tspan40"> </tspan></tspan><tspan
         x="85.823311"
         y="138.0849"
         id="tspan41">výhně žhnou!
</tspan><tspan
         x="85.823311"
         y="150.76229"
         id="tspan42">Hluboko pod horou,<tspan
   y="150.76229"
   id="tspan43"> </tspan></tspan><tspan
         x="85.823311"
         y="163.43969"
         id="tspan44">kde stín a tma,
</tspan><tspan
         x="85.823311"
         y="176.11709"
         id="tspan45">tu kuje Železný oheň<tspan
   y="176.11709"
   id="tspan46"> </tspan></tspan><tspan
         x="85.823311"
         y="188.79449"
         id="tspan47">svůj slavný den.
</tspan><tspan
         x="85.823311"
         y="201.47189"
         id="tspan48">Kdo kladivo drží<tspan
   y="201.47189"
   id="tspan49"> </tspan></tspan><tspan
         x="85.823311"
