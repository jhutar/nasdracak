   id="tspan102"> </tspan></tspan><tspan
         x="85.823311"
         y="138.0849"
         id="tspan103">výhně žhnou!
</tspan><tspan
         x="85.823311"
         y="150.76229"
         id="tspan104">Hluboko pod horou,<tspan
   y="150.76229"
   id="tspan105"> </tspan></tspan><tspan
         x="85.823311"
         y="163.43969"
         id="tspan106">kde stín a tma,
</tspan><tspan
         x="85.823311"
         y="176.11709"
         id="tspan107">tu kuje Železný oheň<tspan
   y="176.11709"
   id="tspan108"> </tspan></tspan><tspan
         x="85.823311"
         y="188.79449"
         id="tspan109">svůj slavný den.
</tspan><tspan
         x="85.823311"
         y="201.47189"
         id="tspan110">Kdo kladivo drží<tspan
   y="201.47189"
   id="tspan111"> </tspan></tspan><tspan
         x="85.823311"
         y="214.14929"
         id="tspan112">pevně, ten nezahyne!</tspan></text><text
