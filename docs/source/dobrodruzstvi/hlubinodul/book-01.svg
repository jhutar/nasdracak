         x="84.632408"
         y="125.40749"
         id="tspan113">Hlas, který zní v<tspan
   y="125.40749"
   id="tspan114"> </tspan></tspan><tspan
         x="84.632408"
         y="138.0849"
         id="tspan115">chodbách, nesmí<tspan
