   id="tspan118"> </tspan></tspan><tspan
         x="84.632408"
         y="163.43969"
         id="tspan119">horý dýšou.
</tspan><tspan
         x="84.632408"
         y="176.11709"
         id="tspan120">Železný oheň,<tspan
   y="176.11709"
   id="tspan121"> </tspan></tspan><tspan
         x="84.632408"
         y="188.79449"
         id="tspan122">hluboko v horách,
</tspan><tspan
         x="84.632408"
