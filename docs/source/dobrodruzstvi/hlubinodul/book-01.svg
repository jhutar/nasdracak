       transform="matrix(0.48631336,0,0,0.48631336,10.829719,56.329352)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan10">Tento svazek </tspan><tspan
         x="37.082859"
         y="134.46279"
         id="tspan11">pojednává o vkládání </tspan><tspan
         x="37.082859"
         y="143.51807"
         id="tspan12">magických run do </tspan><tspan
         x="37.082859"
         y="152.57337"
         id="tspan13">zbraní a zbrojí. Kov </tspan><tspan
         x="37.082859"
         y="161.62867"
         id="tspan14">musí být nejprve </tspan><tspan
         x="37.082859"
         y="170.68396"
         id="tspan15">vyhřát do správné </tspan><tspan
         x="37.082859"
         y="179.73926"
         id="tspan16">rudé, jinak se runa do </tspan><tspan
         x="37.082859"
         y="188.79456"
         id="tspan17">kovu správně </tspan><tspan
         x="37.082859"
         y="197.84986"
         id="tspan18">nezapustí. Řez </tspan><tspan
         x="37.082859"
         y="206.90515"
         id="tspan19">provádíme </tspan><tspan
         x="37.082859"
         y="215.96045"
         id="tspan20">diamantovým rydlem </tspan><tspan
         x="37.082859"
         y="225.01575"
         id="tspan21">pravou rukou - nikdy </tspan><tspan
         x="37.082859"
         y="234.07105"
         id="tspan22">naopak. Runa se po </tspan><tspan
         x="37.082859"
         y="243.12635"
         id="tspan23">vyrytí musí okamžitě </tspan><tspan
         x="37.082859"
         y="252.18164"
         id="tspan24">uhasit olejem z </tspan><tspan
         x="37.082859"
         y="261.23694"
         id="tspan25">hlubinné borovice.</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9.05529px;line-height:1;font-family:'Noto Serif';-inkscape-font-specification:'Noto Serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;white-space:pre;inline-size:95.0991;display:inline;fill:#800000;stroke:none;stroke-width:1.02814"
       x="37.082859"
       y="125.40749"
       id="text32"
       transform="matrix(0.48631336,0,0,0.48631336,67.408215,56.25521)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan26">Chybná runa </tspan><tspan
         x="37.082859"
         y="134.46279"
         id="tspan27">roztrhne kov a magii </tspan><tspan
         x="37.082859"
         y="143.51807"
         id="tspan28">rozptýlí do okolního </tspan><tspan
         x="37.082859"
         y="152.57337"
         id="tspan29">kovu. Proto se nikdy </tspan><tspan
         x="37.082859"
         y="161.62867"
         id="tspan30">nekují dva kusy vedle </tspan><tspan
         x="37.082859"
         y="170.68396"
         id="tspan31">sebe. Mistr, který </tspan><tspan
         x="37.082859"
         y="179.73926"
         id="tspan32">třikrát selže, odkládá </tspan><tspan
         x="37.082859"
         y="188.79456"
         id="tspan33">kladivo a stoupá na </tspan><tspan
         x="37.082859"
         y="197.84986"
         id="tspan34">modlitbu k ohnivé </tspan><tspan
         x="37.082859"
         y="206.90515"
         id="tspan35">výhni. Kdo toto </tspan><tspan
         x="37.082859"
         y="215.96045"
         id="tspan36">pravidlo poruší, ten </tspan><tspan
         x="37.082859"
         y="225.01575"
         id="tspan37">slávě klanu </tspan><tspan
         x="37.082859"
         y="234.07105"
         id="tspan38">nepomůže.</tspan></text><image
