       transform="matrix(0.48631336,0,0,0.48631336,149.82655,56.181064)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan80">V kapitole první a </tspan><tspan
         x="37.082859"
         y="136.27385"
         id="tspan81">druhé vyprávíme o </tspan><tspan
         x="37.082859"
         y="147.1402"
         id="tspan82">legendárním kováři, </tspan><tspan
         x="37.082859"
         y="158.00655"
         id="tspan83">který vykoval devět </tspan><tspan
         x="37.082859"
         y="168.87289"
         id="tspan84">magických prstenů </tspan><tspan
         x="37.082859"
         y="179.73924"
         id="tspan85">pro devět klanů. </tspan><tspan
         x="37.082859"
         y="190.60559"
         id="tspan86">Prsteny nesly moc a </tspan><tspan
         x="37.082859"
         y="201.47194"
         id="tspan87">moc nesla cenu, a </tspan><tspan
         x="37.082859"
         y="212.33829"
         id="tspan88">cena byla zaplacená v </tspan><tspan
         x="37.082859"
         y="223.20464"
         id="tspan89">krvi a v ohni.
</tspan><tspan
         x="37.082859"
         y="234.07098"
         id="tspan90">
</tspan><tspan
         x="37.082859"
         y="244.93733"
         id="tspan91">Epický příběh potom </tspan><tspan
         x="37.082859"
         y="255.80368"
         id="tspan92">plynule přechází v </tspan><tspan
         x="37.082859"
         y="266.67003"
         id="tspan93">návod pro správné </tspan><tspan
         x="37.082859"
         y="277.53636"
         id="tspan94">kalení prstenů:</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9.05529px;line-height:1.2;font-family:'Noto Serif';-inkscape-font-specification:'Noto Serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;white-space:pre;inline-size:95.0991;display:inline;fill:#800000;stroke:none;stroke-width:1.02814"
       x="37.082859"
       y="125.40749"
       id="text32-6"
       transform="matrix(0.48631336,0,0,0.48631336,206.53229,55.088925)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan95">Kalí se při 780 </tspan><tspan
         x="37.082859"
         y="136.27385"
         id="tspan96">stupních, nikoliv </tspan><tspan
         x="37.082859"
         y="147.1402"
         id="tspan97">vyšších. Olej musí být </tspan><tspan
         x="37.082859"
         y="158.00655"
         id="tspan98">z hlubinné borovice, </tspan><tspan
         x="37.082859"
         y="168.87289"
         id="tspan99">starý alespoň deset </tspan><tspan
         x="37.082859"
         y="179.73924"
         id="tspan100">let. Vloží se prsten </tspan><tspan
         x="37.082859"
         y="190.60559"
         id="tspan101">pod úhlem 15 stupňů </tspan><tspan
         x="37.082859"
         y="201.47194"
         id="tspan102">a vyndává se po třech </tspan><tspan
         x="37.082859"
         y="212.33829"
         id="tspan103">minutách. Kdo kalí </tspan><tspan
         x="37.082859"
         y="223.20464"
         id="tspan104">jinak, ten kalí pro </tspan><tspan
         x="37.082859"
         y="234.07098"
         id="tspan105">sebe.</tspan></text><text
