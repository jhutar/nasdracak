       transform="matrix(0.48631336,0,0,0.48631336,10.829719,56.329352)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan4">Tragická hra v pěti </tspan><tspan
         x="37.082859"
         y="136.27385"
         id="tspan5">dějstvích. Princ váhá </tspan><tspan
         x="37.082859"
         y="147.1402"
         id="tspan6">pět dějství, jestli si vzít </tspan><tspan
         x="37.082859"
         y="158.00655"
         id="tspan59">zpět kladivo, které mu </tspan><tspan
         x="37.082859"
         y="168.87289"
         id="tspan60">strýc ukradl. Každé </tspan><tspan
         x="37.082859"
         y="179.73924"
         id="tspan61">dějství končí </tspan><tspan
         x="37.082859"
         y="190.60559"
         id="tspan62">samomluvou a každá </tspan><tspan
         x="37.082859"
         y="201.47194"
         id="tspan63">samomluva je delší </tspan><tspan
         x="37.082859"
         y="212.33829"
         id="tspan64">než ta předchozí.</tspan></text><text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9.05529px;line-height:1.2;font-family:'Noto Serif';-inkscape-font-specification:'Noto Serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;writing-mode:lr-tb;direction:ltr;white-space:pre;inline-size:95.0991;display:inline;fill:#800000;stroke:none;stroke-width:1.02814"
       x="37.082859"
       y="125.40749"
       id="text32"
       transform="matrix(0.48631336,0,0,0.48631336,67.408215,56.25521)"><tspan
         x="37.082859"
         y="125.40749"
         id="tspan65">„Vzít, či nevzít — to je </tspan><tspan
         x="37.082859"
         y="136.27385"
         id="tspan66">zde otázka,&quot; </tspan><tspan
         x="37.082859"
         y="147.1402"
         id="tspan67">vydechne princ v </tspan><tspan
         x="37.082859"
         y="158.00655"
         id="tspan68">dějství pátém a v tom </tspan><tspan
         x="37.082859"
         y="168.87289"
         id="tspan69">okamžiku se podlaha </tspan><tspan
         x="37.082859"
         y="179.73924"
         id="tspan70">rozpadne. Všichni </tspan><tspan
         x="37.082859"
         y="190.60559"
         id="tspan71">aktéři spadnou do </tspan><tspan
         x="37.082859"
         y="201.47194"
         id="tspan72">pece s roztavenou </tspan><tspan
         x="37.082859"
         y="212.33829"
         id="tspan73">rudou.
</tspan><tspan
         x="37.082859"
         y="223.20464"
         id="tspan74">
</tspan><tspan
         x="37.082859"
         y="234.07098"
         id="tspan75">
</tspan><tspan
         x="37.082859"
         y="244.93733"
         id="tspan76">
</tspan><tspan
         x="37.082859"
         y="255.80368"
         id="tspan77">
</tspan><tspan
         x="37.082859"
         y="266.67003"
         id="tspan78">
</tspan><tspan
         x="37.082859"
         y="277.53636"
         id="tspan79">Konec.</tspan></text><image
